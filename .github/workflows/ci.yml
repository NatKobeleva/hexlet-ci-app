name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          install: false

      - name: Setup
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test
